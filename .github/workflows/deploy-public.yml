name: Publish public offline PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run build:public
        env:
          PUBLIC_BASE_PATH: /travel-tips/
          PUBLIC_SITE_URL: https://starrystarry-nights.github.io/travel-tips/
      - run: npm run test:offline
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify anonymous public response
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 5 --retry-delay 5 --max-time 30 "$PUBLISHED_URL" -o /tmp/public-page.html
          python3 - <<'PYVERIFY'
          from pathlib import Path
          html = Path('/tmp/public-page.html').read_text()
          assert '<div id="root"></div>' in html
          assert 'THE XINJIANG EDIT' in html
          assert '/travel-tips/assets/' in html
          print('Anonymous public application HTML verified')
          PYVERIFY
