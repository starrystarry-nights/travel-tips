name: One-time source import

on:
  push:
    paths:
      - source-mirror.ready

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source archive
        run: |
          cat source-mirror.b64-*.txt | base64 -d > source-mirror.zip
          unzip -o source-mirror.zip
          rm source-mirror.zip source-mirror.b64-*.txt source-mirror.ready
          rm -f .github/workflows/import-source.yml
      - name: Commit source and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mirror THE XINJIANG EDIT source"
          git push
